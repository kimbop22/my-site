<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빵 터짐</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #05060d; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: #fff;
  }
  .stage {
    position: relative;
    width: min(100vw, calc(100dvh * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 18px;
    background: #000;
    box-shadow: 0 20px 80px rgba(255, 170, 60, .18);
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  /* 세로 화면(폰)에서는 화면을 꽉 채움 */
  @media (max-aspect-ratio: 1/1) {
    .stage { width: 100vw; height: 100dvh; aspect-ratio: auto; border-radius: 0; }
  }
  .stage:fullscreen { border-radius: 0; box-shadow: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .6s ease; }
  .ui.hide { opacity: 0; }
  .title {
    position: absolute; left: clamp(14px, 3vw, 32px); top: clamp(12px, 2.5vw, 28px);
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .title b { display: block; font-size: clamp(15px, 2.4vw, 26px); font-weight: 800; letter-spacing: -.02em; }
  .title span { display: block; margin-top: 4px; font-size: clamp(11px, 1.4vw, 15px); opacity: .85; }
  .bar {
    position: absolute; left: 50%; bottom: clamp(12px, 3vw, 28px); transform: translateX(-50%);
    display: flex; gap: 8px; padding: 8px; border-radius: 999px;
    background: rgba(20, 10, 30, .35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.2); pointer-events: auto;
  }
  .bar button {
    appearance: none; border: 0; cursor: pointer; color: #fff; font: inherit;
    font-size: clamp(12px, 1.5vw, 15px); padding: 9px 16px; border-radius: 999px;
    background: rgba(255,255,255,.14); min-height: 40px; white-space: nowrap;
    transition: background .2s;
  }
  .bar button:hover, .bar button:focus-visible { background: rgba(255,255,255,.3); outline: none; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="ui" id="ui">
    <div class="title"><b>빵 터짐</b><span>이유는 모르겠지만 일단 웃어요 · 화면을 누르면 펑!</span></div>
    <div class="bar">
      <button id="boom" type="button">💥 한 번 더 펑</button>
      <button id="full" type="button">전체화면</button>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const ui = document.getElementById('ui');

  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const hsla = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`;
  let W = 0, H = 0, dpr = 1;

  /* ───────── 재료 ───────── */
  const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  // 자주 나오는 웃음 이모지
  const LAUGH = ['😂', '🤣', '😆', '😹', '😄', '😁', '😝', '🤪', '😅', '😀', '😃', '😸', '😺', '🤭', '😜', '😛',
    '🥲', '😭', '💀', '☠️', '🤡', '🗿', '🙈', '🙉', '🙊', '🐵', '🫢', '😏', '🤗', '🥳', '🤩', '😋', '😊', '😇'];
  // 가끔 섞이는 이모지 (밈·동물·파티·손짓)
  const EXTRA = ['🙃', '🤯', '😎', '🤠', '🥸', '😬', '🫠', '😻', '👻', '👽', '🤖', '🎃', '💩',
    '🐒', '🦍', '🐶', '🐱', '🐸', '🐷', '🐧', '🦆', '🦄', '🐔', '🐼', '🐨', '🦥', '🐹', '🐰', '🦊', '🐻', '🐙', '🦭',
    '👏', '🙌', '🤙', '👍', '✌️', '🤘', '🫶', '👌', '💃', '🕺', '🤹', '🎉', '🎊', '🎈', '🥁', '📣', '💥', '✨', '🌈',
    '⭐', '💯', '🔥', '🍌', '🍕', '🌮', '🍩', '🍿'];
  const COMBO = ['😂😂😂', '🤣🤣🤣', '😆😆', '💀💀💀', '😹😹', '🤣😂🤣', '🙈🙉🙊', '👏👏👏', '😭😂', '🎉🥳🎉'];
  const TEXT = ['ㅋㅋㅋㅋ', 'ㅋㅋㅋ', 'ㅋㅋㅋㅋㅋㅋㅋ', 'ㅎㅎㅎ', '푸하하', '꺄르르', '크크크', '캬캬캬', '깔깔깔', '낄낄',
    '헤헤', '빵!', '웃참실패', '개웃김', '아 ㅋㅋ', 'ㅋㅋ 미쳤다', 'LOL', 'LMAO', 'ROFL', 'HAHAHA', 'hahaha', 'XD',
    '哈哈哈', '笑死', 'www', '草', '555', 'jajaja', 'kkkkk', 'mdr', 'ahahah'];
  const KAO = ['(≧▽≦)', '٩(^ᴗ^)۶', '(ノ´▽`)ノ', '( ͡° ͜ʖ ͡°)', '(^o^)/', '(*´▽`*)', 'ʕ•ᴥ•ʔ', '(☆▽☆)',
    '╰(*°▽°*)╯', '(๑>◡<๑)', 'ヽ(≧◡≦)ノ', '(≧∇≦)b', '(^▽^)', '＼(^o^)／'];
  const CAPS = ['웃참 실패', 'ㅋㅋㅋㅋ', '아 배 아파', '지금 내 상태', '이걸 참네', 'LOL', '숨 못 쉬는 중',
    '광대 승천', '개웃겨', '와 미쳤다', '현웃 터짐', '눈물 남'];
  const MODES = ['burst', 'rain', 'pop', 'bounce', 'rise'];
  const RATE = { burst: .55, rain: .09, pop: .14, bounce: .6, rise: .13 };

  let items = [], rings = [], conf = [], mode, modeT, modeDur, acc = 0, shake = 0;

  const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const rr = (x, y, w, h, r) => {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };

  // 직접 그린 '눈물 나게 웃는 얼굴' (OS 이모지와 상관없이 항상 같은 모양, 입이 계속 움직임)
  function drawFace(r, t, ph) {
    const g = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r);
    g.addColorStop(0, '#ffec8f'); g.addColorStop(1, '#ffb52e');
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = r * .05; ctx.strokeStyle = '#c77a0a'; ctx.stroke();
    ctx.fillStyle = 'rgba(255,90,110,.3)';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * .62, r * .18, r * .17, r * .1, 0, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = '#4a2a00'; ctx.lineWidth = r * .09; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * r * .38, -r * .18, r * .17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    const open = .5 + .5 * Math.sin(t * 14 + ph), top = r * .1, bot = top + r * (.3 + .55 * open);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-r * .56, top); ctx.lineTo(r * .56, top);
    ctx.bezierCurveTo(r * .5, bot, -r * .5, bot, -r * .56, top); ctx.closePath();
    ctx.fillStyle = '#6b1d0a'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#fff'; ctx.fillRect(-r * .6, top, r * 1.2, r * .13);
    ctx.fillStyle = '#ff6b81'; ctx.beginPath(); ctx.ellipse(0, bot, r * .3, r * .2, 0, 0, TAU); ctx.fill();
    ctx.restore();
    for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
      const f = (t * 1.6 + ph + k * .5) % 1;
      ctx.beginPath(); ctx.ellipse(s * (r * .5 + r * .45 * f), -r * .02 + r * .35 * f, r * .07, r * .1, 0, 0, TAU);
      ctx.fillStyle = `rgba(90,200,255,${1 - f})`; ctx.fill();
    }
  }

  const content = () => {
    const r = Math.random(), base = rnd(.11, .27) * Math.min(W, H) + 22;
    if (r < .38) return { type: 'emoji', txt: pick(LAUGH), size: base };
    if (r < .55) return { type: 'emoji', txt: pick(EXTRA), size: base * .9 };
    if (r < .62) return { type: 'emoji', txt: pick(COMBO), size: base * .5 };
    if (r < .73) return { type: 'face', size: base * 1.05, ph: rnd(0, TAU) };
    if (r < .88) return { type: 'text', txt: pick(TEXT), size: base * .6, hue: rnd(0, 360) };
    if (r < .93) return { type: 'kao', txt: pick(KAO), size: base * .5, hue: rnd(0, 360) };
    return { type: 'card', cap: pick(CAPS), size: base * 1.1, ph: rnd(0, TAU) };
  };
  const spawn = (x, y, vx, vy, o = {}) => {
    if (items.length > 90) return;
    items.push(Object.assign(content(), {
      x, y, vx, vy, g: 0, rot: rnd(-.4, .4), vr: rnd(-1.5, 1.5), life: 0, dur: rnd(2, 3),
      sh: rnd(14, 30), sw: 0, ph2: rnd(0, TAU), bw: false, bt: false, damp: .8, off: false
    }, o));
  };
  const spawnBounce = () => {
    const sp = Math.min(W, H) * rnd(.25, .55), a = rnd(0, TAU);
    spawn(rnd(.1, .9) * W, rnd(.1, .9) * H, Math.cos(a) * sp, Math.sin(a) * sp, { bw: true, bt: true, dur: rnd(8, 12), damp: 1, vr: rnd(-2, 2) });
  };
  const burst = (bx, by) => {
    const m = Math.min(W, H), cx = bx ?? W / 2, cy = by ?? H * .6;
    for (let i = 0; i < 8; i++) {
      const a = rnd(-Math.PI * .95, -Math.PI * .05), sp = m * rnd(.6, 1.3);
      spawn(cx, cy, Math.cos(a) * sp * 1.2, Math.sin(a) * sp, { g: m * 1.5, bw: true, damp: .82, dur: rnd(3.5, 5), vr: rnd(-4, 4) });
    }
    rings.push({ x: cx, y: cy, r: 0, a: .9 });
    shake = m * .025;
    for (let i = 0; i < 36 && conf.length < 180; i++) {
      const a = rnd(-Math.PI, 0), sp = m * rnd(.4, 1.1);
      conf.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rnd(0, TAU), vr: rnd(-8, 8), hue: rnd(0, 360), life: 0 });
    }
  };
  const doSpawn = () => {
    const m = Math.min(W, H);
    if (mode === 'burst') burst();
    else if (mode === 'rain') spawn(rnd(0, W), -m * .3, rnd(-.03, .03) * W, H * rnd(.3, .6), { dur: 99, off: true, sw: rnd(1, 3) });
    else if (mode === 'rise') spawn(rnd(0, W), H + m * .3, rnd(-.02, .02) * W, -H * rnd(.2, .45), { dur: 99, off: true, sw: rnd(1, 3) });
    else if (mode === 'pop') spawn(rnd(.08, .92) * W, rnd(.1, .9) * H, 0, 0, { dur: rnd(1.4, 2.4) });
    else if (items.length < 28) spawnBounce();
  };
  // 7~11초마다 터지는 방식이 바뀌며 끝없이 반복
  const setMode = m => {
    mode = m; modeT = 0; modeDur = rnd(7, 11); acc = 0;
    if (m === 'bounce') for (let i = 0; i < 10; i++) spawnBounce();
  };

  function draw(t, dt) {
    const m = Math.min(W, H), hh = t * 14;
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, hsla(hh + 20, 92, 62)); bg.addColorStop(1, hsla(hh + 80, 92, 56));
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    modeT += dt;
    if (modeT > modeDur) { let n; do { n = pick(MODES); } while (n === mode); setMode(n); }
    acc += dt;
    while (acc > RATE[mode]) { acc -= RATE[mode]; doSpawn(); }

    shake *= Math.exp(-dt * 6);
    ctx.save();
    ctx.translate(rnd(-1, 1) * shake, rnd(-1, 1) * shake);

    for (let i = rings.length - 1; i >= 0; i--) {
      const p = rings[i]; p.r += dt * m * 1.6; p.a -= dt * 1.6;
      if (p.a <= 0) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(255,255,255,${p.a})`; ctx.lineWidth = m * .012;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (let i = items.length - 1; i >= 0; i--) {
      const o = items[i];
      o.life += dt; o.x += o.vx * dt; o.y += o.vy * dt; o.vy += o.g * dt; o.rot += o.vr * dt;
      const rad = o.size * .45;
      if (o.bw) {
        if (o.x < rad) { o.x = rad; o.vx = Math.abs(o.vx) * o.damp; }
        else if (o.x > W - rad) { o.x = W - rad; o.vx = -Math.abs(o.vx) * o.damp; }
        if (o.y > H - rad) { o.y = H - rad; o.vy = -Math.abs(o.vy) * o.damp; }
        if (o.bt && o.y < rad) { o.y = rad; o.vy = Math.abs(o.vy) * o.damp; }
      }
      if (o.life > o.dur || (o.off && (o.y > H + o.size * 1.5 || o.y < -o.size * 1.5))) { items.splice(i, 1); continue; }
      const sc = back(Math.min(1, o.life / .3)) * (o.dur - o.life < .35 ? (o.dur - o.life) / .35 : 1) * (1 + .05 * Math.sin(o.life * o.sh));
      ctx.save();
      ctx.translate(o.x + (o.sw ? Math.sin(o.life * o.sw * 2 + o.ph2) * o.size * .18 : 0), o.y);
      ctx.rotate(o.rot + Math.sin(o.life * o.sh) * .1);
      ctx.scale(Math.max(0, sc), Math.max(0, sc));
      if (o.type === 'emoji') {
        ctx.font = `${o.size}px ${EF}`; ctx.fillText(o.txt, 0, 0);
      } else if (o.type === 'face') {
        drawFace(o.size * .5, o.life, o.ph);
      } else if (o.type === 'text' || o.type === 'kao') {
        ctx.font = `800 ${o.size}px "Malgun Gothic","Segoe UI Symbol",sans-serif`;
        ctx.lineWidth = o.size * .14; ctx.strokeStyle = 'rgba(255,255,255,.96)'; ctx.strokeText(o.txt, 0, 0);
        ctx.fillStyle = hsla(o.hue + 200, 85, 42); ctx.fillText(o.txt, 0, 0);
      } else {
        const w = o.size * 1.5, h = o.size * 1.35;
        ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
        rr(-w / 2, -h / 2, w, h, w * .08); ctx.fillStyle = '#fff'; ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.save(); ctx.translate(0, -h * .1); drawFace(w * .3, o.life, o.ph); ctx.restore();
        ctx.fillStyle = '#111'; ctx.font = `800 ${w * .11}px "Malgun Gothic",sans-serif`;
        ctx.fillText(o.cap, 0, h * .36, w * .9);
      }
      ctx.restore();
    }

    for (let i = conf.length - 1; i >= 0; i--) {
      const c = conf[i]; c.life += dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += m * dt; c.rot += c.vr * dt;
      if (c.life > 2.2) { conf.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
      ctx.fillStyle = hsla(c.hue, 95, 55, 1 - c.life / 2.2);
      ctx.fillRect(-m * .008, -m * .005, m * .016, m * .01); ctx.restore();
    }
    ctx.restore();
  }

  /* ───────── 엔진 ───────── */
  let last = performance.now();
  const t0 = last;

  function reset() {
    items = []; rings = []; conf = []; shake = 0;
    setMode('burst');
    for (let i = 0; i < 6; i++) spawn(rnd(.1, .9) * W, rnd(.1, .9) * H, 0, 0, { life: rnd(0, 1) });
  }
  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    reset();
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    draw((now - t0) / 1000, dt);
    requestAnimationFrame(frame);
  }

  // 가만히 있으면 버튼 숨김
  let hideTimer;
  const showUi = () => { ui.classList.remove('hide'); clearTimeout(hideTimer); hideTimer = setTimeout(() => ui.classList.add('hide'), 3500); };
  ['pointermove', 'pointerdown', 'keydown'].forEach(e => window.addEventListener(e, showUi, { passive: true }));

  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.bar')) return;
    const r = stage.getBoundingClientRect();
    burst(e.clientX - r.left, e.clientY - r.top);
  });
  document.getElementById('boom').addEventListener('click', () => burst());
  document.getElementById('full').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (stage.requestFullscreen) stage.requestFullscreen();
    } catch (e) { /* 전체화면 미지원 환경 */ }
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); burst(); }
    else if (e.key === 'f' || e.key === 'F') document.getElementById('full').click();
  });

  new ResizeObserver(resize).observe(stage);
  resize();
  showUi();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
